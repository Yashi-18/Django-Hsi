{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Website Profil{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}" />
  </head>
  <body>
    <header class="logo">
      <img width="80" src="{% static 'images/logo.webp' %}" alt="logo" />
      <h1 class="h1">{% block page_title %}HSI Boarding School Purworejo{% endblock %}</h1>
      <h3 class="h3">{% block subtitle %}Website Profil Sederhana — Kelas X{% endblock %}</h3>
      <nav>
        <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
        <a href="{% url 'biodata' %}" class="{% if request.resolver_match.url_name == 'biodata' %}active{% endif %}">Biodata</a>
        <a href="{% url 'jadwal' %}" class="{% if request.resolver_match.url_name == 'jadwal' %}active{% endif %}">Jadwal</a>
        <a href="{% url 'galeri' %}" class="{% if request.resolver_match.url_name == 'galeri' %}active{% endif %}">Galeri</a>
        <a href="{% url 'feedback' %}" class="{% if request.resolver_match.url_name == 'feedback' %}active{% endif %}">Feedback</a>
      </nav>
    </header>
    <main>
    {% block content %}
      
    {% endblock %}
    </main>
  </body>
</html>
